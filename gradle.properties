android.useAndroidX=true
# AGP 9 默认启用 built-in Kotlin，会与 org.jetbrains.kotlin.android 抢注 kotlin 扩展
# （报 "Cannot add extension with name 'kotlin'")。关掉它，继续使用外部 KGP + Compose 编译器插件。
android.builtInKotlin=false
# AGP 9.0 的新 DSL 与 KGP 2.4.x 不兼容（报 "not compatible with AGP's 9.0 new DSL" + BaseExtension 强转失败）。
# 两个开关必须同时关，才能用「外部 KGP + AGP 旧 DSL」这套传统组合。
android.newDsl=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
